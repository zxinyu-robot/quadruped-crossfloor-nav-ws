name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 clang-format（固定版本，避免格式化漂移）
        run: pip install "clang-format==18.1.3"
      - name: 格式门禁
        run: |
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --style=file --dry-run --Werror
      - run: cmake -S . -B build -DLEGGED_NAV_BUILD_TESTS=ON
      - run: cmake --build build -j"$(nproc)"
      - run: ctest --test-dir build --output-on-failure

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 契约生成物与 contracts/runtime_contract.json 同步
        run: python3 scripts/gen_contract.py --check

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  dds-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DDS 类型生成物与 ROSIDL 快照同步（无 idlc 降级模式）
        run: python3 scripts/gen_dds_types.py --check
